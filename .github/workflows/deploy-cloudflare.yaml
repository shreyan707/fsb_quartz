name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # og-image is disabled in quartz.config.yaml for fast local builds; enable it for deploy
      - name: Enable og-image plugin
        run: |
          sed -i '/source: "@quartz-community\/og-image"/,/enabled:/ s/enabled: false/enabled: true/' quartz.config.yaml
          grep -A3 'source: "@quartz-community/og-image"' quartz.config.yaml | grep -q 'enabled: true'
      - run: npx quartz build
      - run: npm run postprocess
      - run: node scripts/prepare-cloudflare.mjs public
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
