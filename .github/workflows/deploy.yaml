name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # og-image is disabled in quartz.config.yaml for fast local builds; enable it for deploy
      - name: Enable og-image plugin
        run: |
          sed -i '/source: "@quartz-community\/og-image"/,/enabled:/ s/enabled: false/enabled: true/' quartz.config.yaml
          grep -A3 'source: "@quartz-community/og-image"' quartz.config.yaml | grep -q 'enabled: true'
      - run: npx quartz build
      - run: node scripts/fix-tag-links.mjs public
      - run: node scripts/fix-a11y.mjs public
      - run: node scripts/split-content-index.mjs public
      - run: node scripts/optimize-images.mjs public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
