name: Deploy to GitHub Pages
# The site now lives on Cloudflare (see deploy-cloudflare.yaml). This keeps the old
# shreyan707.github.io/fsb_quartz address working by publishing redirect stubs:
# every page sends visitors to the same path on the new host.
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build gives the list of pages (and an RSS feed linking to the new host)
      - run: npx quartz build
      - run: node scripts/make-redirect-site.mjs public https://bhubaneswar.filmsociety.workers.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
